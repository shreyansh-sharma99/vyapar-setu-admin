<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Products move from a shop into the ecnbiz app and orders fly out to a customer's home">
  <style>
    .fly-in  { animation: flyIn 4.5s ease-in-out infinite; }
    .fly-out { animation: flyOut 4.5s ease-in-out infinite; }
    .d1 { animation-delay: -1.5s; } .d2 { animation-delay: -3s; }
    @keyframes flyIn {
      0%   { transform: translate(112px, 196px) scale(.5); opacity: 0; }
      12%  { opacity: 1; }
      50%  { transform: translate(150px, 96px) scale(1); }
      88%  { transform: translate(206px, 128px) scale(.55); opacity: 1; }
      100% { transform: translate(214px, 136px) scale(.4); opacity: 0; }
    }
    @keyframes flyOut {
      0%   { transform: translate(276px, 170px) scale(.4); opacity: 0; }
      12%  { opacity: 1; }
      50%  { transform: translate(338px, 112px) scale(1); }
      88%  { transform: translate(394px, 224px) scale(.7); opacity: 1; }
      100% { transform: translate(398px, 232px) scale(.6); opacity: 0; }
    }

    .toast { animation: toast 4.5s ease-in-out infinite; }
    @keyframes toast {
      0%, 15% { transform: translateY(-40px); }
      25%, 70% { transform: translateY(0); }
      80%, 100% { transform: translateY(-40px); }
    }
    .tile { transform-box: fill-box; transform-origin: center; animation: tile 4.5s ease-in-out infinite; }
    .t2 { animation-delay: -1.1s; } .t3 { animation-delay: -2.2s; } .t4 { animation-delay: -3.3s; }
    @keyframes tile { 0%, 80%, 100% { transform: scale(1); } 88% { transform: scale(1.08); } }
    .badge { transform-box: fill-box; transform-origin: center; animation: badge 1.5s ease-in-out infinite; }
    @keyframes badge { 0%, 70%, 100% { transform: scale(1); } 80% { transform: scale(1.4); } }
    .tap { transform-box: fill-box; transform-origin: center; animation: tap 1.5s ease-out infinite; }
    @keyframes tap { 0% { transform: scale(.2); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
    .btn { transform-box: fill-box; transform-origin: center; animation: btn 1.5s ease-in-out infinite; }
    @keyframes btn { 0%, 100% { transform: scale(1); } 10% { transform: scale(.94); } 20% { transform: scale(1); } }

    .wave { transform-box: fill-box; transform-origin: 50% 0; animation: wave .5s ease-in-out infinite alternate; }
    @keyframes wave { from { transform: rotate(150deg); } to { transform: rotate(195deg); } }
    .bob { animation: bob 1.2s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-2px); } }

    .rise { animation: rise 3s ease-out infinite; }
    .r2 { animation-delay: -1s; } .r3 { animation-delay: -2s; }
    @keyframes rise {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-30px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
  </style>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <pattern id="awning" width="20" height="16" patternUnits="userSpaceOnUse">
      <rect width="10" height="16" fill="#6366f1"/><rect x="10" width="10" height="16" fill="#fff"/>
    </pattern>
    <clipPath id="screen"><rect x="188" y="36" width="104" height="226" rx="12"/></clipPath>
    <g id="box">
      <rect x="-11" y="-20" width="22" height="20" rx="2" fill="#f59e0b"/>
      <rect x="-11" y="-20" width="22" height="6" fill="#d97706"/>
      <rect x="-2" y="-20" width="4" height="10" fill="#fde68a"/>
    </g>
    <g id="bag">
      <path d="M-6 -20a6 6 0 0 1 12 0" fill="none" stroke="#4338ca" stroke-width="2.5"/>
      <rect x="-10" y="-20" width="20" height="20" rx="3" fill="#6366f1"/>
    </g>
    <g id="bottle">
      <rect x="-6" y="-24" width="12" height="24" rx="4" fill="#10b981"/>
      <rect x="-3" y="-30" width="6" height="7" rx="1" fill="#047857"/>
      <rect x="-6" y="-16" width="12" height="7" fill="#d1fae5"/>
    </g>
    <g id="shirt">
      <path d="M-10-18L-4-22L4-22L10-18L7-12L4-13L4 0L-4 0L-4-13L-7-12Z" fill="#ec4899"/>
    </g>
  </defs>

  <!-- ground -->
  <line x1="10" y1="262" x2="470" y2="262" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="240" cy="280" rx="80" ry="8" fill="#a5b4fc" opacity=".35"/>

  <!-- little shop on the left -->
  <rect x="26" y="182" width="96" height="80" fill="url(#wall)" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="18" y="170" width="112" height="16" rx="3" fill="url(#awning)"/>
  <rect x="16" y="166" width="116" height="6" rx="3" fill="#4338ca"/>
  <rect x="34" y="196" width="30" height="30" rx="3" fill="#e0f2fe" stroke="#6366f1" stroke-width="2"/>
  <rect x="39" y="210" width="6" height="14" rx="1" fill="#f59e0b"/><rect x="48" y="214" width="6" height="10" rx="1" fill="#10b981"/><rect x="56" y="208" width="5" height="16" rx="1" fill="#f43f5e"/>
  <rect x="78" y="204" width="28" height="58" rx="3" fill="#312e81"/>
  <rect x="81" y="207" width="22" height="55" rx="2" fill="#fde68a" opacity=".55"/>
  <!-- shop owner in the doorway -->
  <g class="bob">
    <rect x="85" y="230" width="10" height="32" rx="4" fill="#f97316"/>
    <circle cx="90" cy="222" r="7" fill="#f1c27d"/>
    <path d="M83 221a7 7 0 0 1 14 0z" fill="#3f2a1d"/>
  </g>

  <!-- home on the right -->
  <rect x="360" y="196" width="84" height="66" fill="url(#wall)" stroke="#c7d2fe" stroke-width="1.5"/>
  <path d="M350 198L402 156L454 198z" fill="#f97316"/>
  <rect x="394" y="226" width="18" height="36" rx="2" fill="#6366f1"/>
  <rect x="368" y="208" width="16" height="13" rx="1" fill="#e0f2fe" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="422" y="208" width="16" height="13" rx="1" fill="#e0f2fe" stroke="#6366f1" stroke-width="1.5"/>
  <!-- waving customer -->
  <g transform="translate(428 262)">
    <rect x="-5" y="-24" width="5" height="24" rx="2.5" fill="#1e3a8a"/>
    <rect x="0" y="-24" width="5" height="24" rx="2.5" fill="#1e40af"/>
    <rect x="-9" y="-50" width="18" height="29" rx="7" fill="#10b981"/>
    <rect class="wave" x="5" y="-47" width="5" height="22" rx="2.5" fill="#059669"/>
    <circle cx="0" cy="-58" r="8" fill="#c68642"/>
    <path d="M-8-59a8 8 0 0 1 16 0v10h-3v-10h-10v10h-3z" fill="#111827"/>
  </g>

  <!-- phone -->
  <rect x="180" y="24" width="120" height="250" rx="18" fill="#1e1b4b"/>
  <rect x="188" y="36" width="104" height="226" rx="12" fill="#fff"/>
  <g clip-path="url(#screen)">
    <rect x="188" y="36" width="104" height="34" fill="url(#brand)"/>
    <text x="198" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#fff">ecn<tspan fill="#fdba74">biz</tspan></text>
    <path d="M262 48h3l3 10h10l2-7h-13" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="270" cy="61" r="1.5" fill="#fff"/><circle cx="277" cy="61" r="1.5" fill="#fff"/>
    <circle class="badge" cx="281" cy="47" r="5" fill="#f43f5e"/>

    <g class="tile"><rect x="196" y="80" width="42" height="56" rx="7" fill="#eef2ff"/><use href="#box" transform="translate(217 116)"/><rect x="202" y="124" width="22" height="4" rx="2" fill="#c7d2fe"/></g>
    <g class="tile t2"><rect x="244" y="80" width="42" height="56" rx="7" fill="#fdf2f8"/><use href="#shirt" transform="translate(265 116)"/><rect x="250" y="124" width="22" height="4" rx="2" fill="#fbcfe8"/></g>
    <g class="tile t3"><rect x="196" y="142" width="42" height="56" rx="7" fill="#ecfdf5"/><use href="#bottle" transform="translate(217 180)"/><rect x="202" y="186" width="22" height="4" rx="2" fill="#a7f3d0"/></g>
    <g class="tile t4"><rect x="244" y="142" width="42" height="56" rx="7" fill="#eef2ff"/><use href="#bag" transform="translate(265 178)"/><rect x="250" y="186" width="22" height="4" rx="2" fill="#c7d2fe"/></g>

    <g class="btn"><rect x="196" y="208" width="90" height="24" rx="12" fill="#f97316"/>
      <text x="241" y="224" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#fff">Buy now</text></g>
    <circle class="tap" cx="262" cy="220" r="10" fill="none" stroke="#f97316" stroke-width="2"/>

    <g class="toast">
      <rect x="194" y="40" width="92" height="26" rx="8" fill="#fff" stroke="#e0e7ff"/>
      <circle cx="206" cy="53" r="6" fill="#22c55e"/>
      <path d="M203 53l2 2 4-4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="216" y="51" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="7.5" font-weight="700" fill="#1e1b4b">New order</text>
      <text x="216" y="60" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="6.5" fill="#64748b">#1024 · paid</text>
    </g>
  </g>
  <rect x="222" y="40" width="36" height="6" rx="3" fill="#1e1b4b"/>

  <!-- stock flying from the shop into the app -->
  <use href="#box" class="fly-in"/>
  <use href="#shirt" class="fly-in d1"/>
  <use href="#bottle" class="fly-in d2"/>

  <!-- orders flying from the app to the home -->
  <use href="#bag" class="fly-out"/>
  <use href="#box" class="fly-out d1"/>
  <use href="#bag" class="fly-out d2"/>

  <!-- hearts and coins above the phone -->
  <g transform="translate(210 18)"><path class="rise" d="M0 3C-6-2-4-7 0-4C4-7 6-2 0 3z" fill="#f43f5e"/></g>
  <g transform="translate(240 14)"><g class="rise r2"><circle r="5" fill="#f59e0b"/><circle r="3" fill="none" stroke="#fde68a" stroke-width="1.2"/></g></g>
  <g transform="translate(270 18)"><path class="rise r3" d="M0 3C-6-2-4-7 0-4C4-7 6-2 0 3z" fill="#f43f5e"/></g>
</svg>
