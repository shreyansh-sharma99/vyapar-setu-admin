<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="Shoppers and products moving in and out of an ecnbiz shop">
  <style>
    .mv { animation: 12s linear infinite; }
    .in-l  { animation-name: inL; }
    .out-r { animation-name: outR; animation-delay: -6s; }
    .in-r  { animation-name: inR;  animation-delay: -3s; }
    .out-l { animation-name: outL; animation-delay: -9s; }
    @keyframes inL {
      0%   { transform: translate(-30px, 300px); opacity: 1; }
      50%  { transform: translate(240px, 300px); opacity: 1; }
      62%  { transform: translate(240px, 258px) scale(.75); opacity: 1; }
      68%, 100% { transform: translate(240px, 258px) scale(.75); opacity: 0; }
    }
    @keyframes inR {
      0%   { transform: translate(510px, 300px); opacity: 1; }
      50%  { transform: translate(240px, 300px); opacity: 1; }
      62%  { transform: translate(240px, 258px) scale(.75); opacity: 1; }
      68%, 100% { transform: translate(240px, 258px) scale(.75); opacity: 0; }
    }
    @keyframes outR {
      0%, 30% { transform: translate(240px, 258px) scale(.75); opacity: 0; }
      36%  { transform: translate(240px, 258px) scale(.75); opacity: 1; }
      48%  { transform: translate(240px, 300px) scale(1); opacity: 1; }
      100% { transform: translate(510px, 300px); opacity: 1; }
    }
    @keyframes outL {
      0%, 30% { transform: translate(240px, 258px) scale(.75); opacity: 0; }
      36%  { transform: translate(240px, 258px) scale(.75); opacity: 1; }
      48%  { transform: translate(240px, 300px) scale(1); opacity: 1; }
      100% { transform: translate(-30px, 300px); opacity: 1; }
    }

    .leg, .arm { transform-box: fill-box; transform-origin: 50% 0; animation: swing .5s ease-in-out infinite alternate; }
    .leg.b, .arm { animation-direction: alternate-reverse; }
    @keyframes swing { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
    .bob { animation: bob .25s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(-2px); } }

    .prod-in  { animation: prodIn 6s linear infinite; }
    .prod-out { animation: prodOut 6s linear infinite; }
    .d2 { animation-delay: -2s; } .d4 { animation-delay: -4s; }
    @keyframes prodIn {
      0%   { transform: translate(14px, 244px); opacity: 0; }
      8%, 88% { opacity: 1; }
      100% { transform: translate(182px, 244px); opacity: 0; }
    }
    @keyframes prodOut {
      0%   { transform: translate(298px, 244px); opacity: 0; }
      12%, 92% { opacity: 1; }
      100% { transform: translate(466px, 244px); opacity: 0; }
    }
    .belt { animation: belt .6s linear infinite; }
    @keyframes belt { to { stroke-dashoffset: -10; } }

    .rise { animation: rise 3s ease-out infinite; }
    .r2 { animation-delay: -1s; } .r3 { animation-delay: -2s; }
    @keyframes rise {
      0%   { transform: translateY(0); opacity: 0; }
      20%  { opacity: 1; }
      100% { transform: translateY(-38px); opacity: 0; }
    }
    .cloud { animation: drift 40s linear infinite; }
    .cloud.c2 { animation-duration: 55s; animation-delay: -25s; }
    @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(560px); } }

    @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
  </style>

  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity=".45"/><stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </linearGradient>
    <g id="box">
      <rect x="-11" y="-20" width="22" height="20" rx="2" fill="#f59e0b"/>
      <rect x="-11" y="-20" width="22" height="6" fill="#d97706"/>
      <rect x="-2" y="-20" width="4" height="10" fill="#fde68a"/>
    </g>
    <g id="bag">
      <path d="M-6 -20a6 6 0 0 1 12 0" fill="none" stroke="#4338ca" stroke-width="2.5"/>
      <rect x="-10" y="-20" width="20" height="20" rx="3" fill="#6366f1"/>
      <path d="M-4 -10h8a4 4 0 1 0 -1.2 2.8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="bottle">
      <rect x="-6" y="-24" width="12" height="24" rx="4" fill="#10b981"/>
      <rect x="-3" y="-30" width="6" height="7" rx="1" fill="#047857"/>
      <rect x="-6" y="-16" width="12" height="7" fill="#d1fae5"/>
    </g>
  </defs>

  <!-- clouds -->
  <g class="cloud" opacity=".7"><ellipse cx="0" cy="40" rx="26" ry="9" fill="#c7d2fe"/><ellipse cx="14" cy="33" rx="14" ry="10" fill="#c7d2fe"/></g>
  <g class="cloud c2" opacity=".55"><ellipse cx="0" cy="70" rx="20" ry="7" fill="#c7d2fe"/><ellipse cx="-8" cy="64" rx="11" ry="8" fill="#c7d2fe"/></g>

  <!-- ground -->
  <rect x="0" y="250" width="480" height="70" fill="url(#ground)"/>
  <line x1="0" y1="250" x2="480" y2="250" stroke="#a5b4fc" stroke-width="2" stroke-linecap="round"/>

  <!-- shop sign -->
  <rect x="236" y="88" width="3" height="10" fill="#4338ca"/>
  <rect x="190" y="58" width="100" height="32" rx="9" fill="url(#brand)"/>
  <text x="240" y="80" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" fill="#fff" letter-spacing="-.5">ecn<tspan fill="#fdba74">biz</tspan></text>

  <!-- shop body and awning -->
  <rect x="170" y="118" width="140" height="132" fill="url(#wall)" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="158" y="94" width="164" height="10" rx="4" fill="#4338ca"/>
  <g>
    <rect x="160" y="104" width="20" height="18" fill="#6366f1"/><circle cx="170" cy="122" r="10" fill="#6366f1"/>
    <rect x="180" y="104" width="20" height="18" fill="#fff"/><circle cx="190" cy="122" r="10" fill="#fff"/>
    <rect x="200" y="104" width="20" height="18" fill="#6366f1"/><circle cx="210" cy="122" r="10" fill="#6366f1"/>
    <rect x="220" y="104" width="20" height="18" fill="#fff"/><circle cx="230" cy="122" r="10" fill="#fff"/>
    <rect x="240" y="104" width="20" height="18" fill="#6366f1"/><circle cx="250" cy="122" r="10" fill="#6366f1"/>
    <rect x="260" y="104" width="20" height="18" fill="#fff"/><circle cx="270" cy="122" r="10" fill="#fff"/>
    <rect x="280" y="104" width="20" height="18" fill="#6366f1"/><circle cx="290" cy="122" r="10" fill="#6366f1"/>
    <rect x="300" y="104" width="20" height="18" fill="#fff"/><circle cx="310" cy="122" r="10" fill="#fff"/>
  </g>

  <!-- windows with shelves -->
  <g stroke="#6366f1" stroke-width="2">
    <rect x="182" y="142" width="34" height="40" rx="3" fill="#e0f2fe"/>
    <rect x="264" y="142" width="34" height="40" rx="3" fill="#e0f2fe"/>
    <line x1="182" y1="162" x2="216" y2="162"/><line x1="264" y1="162" x2="298" y2="162"/>
  </g>
  <rect x="187" y="151" width="7" height="10" rx="1" fill="#f59e0b"/><rect x="197" y="153" width="6" height="8" rx="1" fill="#10b981"/><rect x="206" y="150" width="6" height="11" rx="1" fill="#f43f5e"/>
  <rect x="188" y="171" width="9" height="10" rx="1" fill="#6366f1"/><rect x="201" y="173" width="10" height="8" rx="1" fill="#f97316"/>
  <rect x="269" y="152" width="8" height="9" rx="1" fill="#f43f5e"/><rect x="281" y="150" width="6" height="11" rx="1" fill="#f59e0b"/><rect x="290" y="153" width="5" height="8" rx="1" fill="#6366f1"/>
  <rect x="270" y="172" width="10" height="9" rx="1" fill="#10b981"/><rect x="284" y="171" width="9" height="10" rx="1" fill="#f97316"/>

  <!-- door -->
  <rect x="222" y="180" width="36" height="70" rx="4" fill="#312e81"/>
  <rect x="226" y="184" width="28" height="66" rx="2" fill="#fde68a" opacity=".55"/>
  <rect x="228" y="168" width="24" height="9" rx="2" fill="#22c55e"/>
  <text x="240" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="6.5" font-weight="700" fill="#fff">OPEN</text>

  <!-- side hatches -->
  <rect x="170" y="222" width="14" height="22" fill="#312e81"/>
  <rect x="296" y="222" width="14" height="22" fill="#312e81"/>

  <!-- conveyor belts -->
  <rect x="8" y="244" width="176" height="6" rx="3" fill="#475569"/>
  <rect x="296" y="244" width="176" height="6" rx="3" fill="#475569"/>
  <line class="belt" x1="10" y1="247" x2="182" y2="247" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/>
  <line class="belt" x1="298" y1="247" x2="470" y2="247" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- products coming in (left) and going out (right) -->
  <use href="#box" class="prod-in"/>
  <use href="#bottle" class="prod-in d2"/>
  <use href="#bag" class="prod-in d4"/>
  <use href="#bag" class="prod-out"/>
  <use href="#box" class="prod-out d2"/>
  <use href="#bottle" class="prod-out d4"/>

  <!-- hearts and coins rising from the sign -->
  <g transform="translate(204 56)"><path class="rise" d="M0 3C-6-2-4-7 0-4C4-7 6-2 0 3z" fill="#f43f5e"/></g>
  <g transform="translate(240 50)"><g class="rise r2"><circle r="5" fill="#f59e0b"/><circle r="3" fill="none" stroke="#fde68a" stroke-width="1.2"/></g></g>
  <g transform="translate(276 56)"><path class="rise r3" d="M0 3C-6-2-4-7 0-4C4-7 6-2 0 3z" fill="#f43f5e"/></g>

  <!-- shopper walking in from the left -->
  <g class="mv in-l"><g class="bob">
    <rect class="leg a" x="-5" y="-24" width="5" height="24" rx="2.5" fill="#1e293b"/>
    <rect class="leg b" x="0" y="-24" width="5" height="24" rx="2.5" fill="#334155"/>
    <rect x="-9" y="-50" width="18" height="29" rx="7" fill="#f97316"/>
    <rect class="arm" x="-2" y="-47" width="5" height="22" rx="2.5" fill="#ea580c"/>
    <circle cx="0" cy="-58" r="8" fill="#f1c27d"/>
    <path d="M-8-59a8 8 0 0 1 16 0z" fill="#3f2a1d"/>
  </g></g>

  <!-- shopper leaving to the right with a bag -->
  <g class="mv out-r"><g class="bob">
    <rect class="leg a" x="-5" y="-24" width="5" height="24" rx="2.5" fill="#1e3a8a"/>
    <rect class="leg b" x="0" y="-24" width="5" height="24" rx="2.5" fill="#1e40af"/>
    <rect x="-9" y="-50" width="18" height="29" rx="7" fill="#10b981"/>
    <circle cx="0" cy="-58" r="8" fill="#c68642"/>
    <path d="M-9-58a9 9 0 0 1 18 0v6h-3v-6h-12v8h-3z" fill="#111827"/>
    <g class="arm"><rect x="-2" y="-47" width="5" height="22" rx="2.5" fill="#059669"/><use href="#bag" transform="translate(.5 -12) scale(.6)"/></g>
  </g></g>

  <!-- shopper walking in from the right -->
  <g class="mv in-r"><g transform="scale(-1 1)"><g class="bob">
    <rect class="leg a" x="-5" y="-24" width="5" height="24" rx="2.5" fill="#374151"/>
    <rect class="leg b" x="0" y="-24" width="5" height="24" rx="2.5" fill="#4b5563"/>
    <rect x="-9" y="-50" width="18" height="29" rx="7" fill="#ec4899"/>
    <rect class="arm" x="-2" y="-47" width="5" height="22" rx="2.5" fill="#db2777"/>
    <circle cx="0" cy="-58" r="8" fill="#e0ac69"/>
    <path d="M-8-59a8 8 0 0 1 16 0v10h-3v-10h-10v10h-3z" fill="#6b3e26"/>
  </g></g></g>

  <!-- shopper leaving to the left with a box -->
  <g class="mv out-l"><g transform="scale(-1 1)"><g class="bob">
    <rect class="leg a" x="-5" y="-24" width="5" height="24" rx="2.5" fill="#3f3f46"/>
    <rect class="leg b" x="0" y="-24" width="5" height="24" rx="2.5" fill="#52525b"/>
    <rect x="-9" y="-50" width="18" height="29" rx="7" fill="#6366f1"/>
    <circle cx="0" cy="-58" r="8" fill="#f1c27d"/>
    <path d="M-8-60a8 8 0 0 1 16 0z" fill="#1f2937"/>
    <use href="#box" transform="translate(8 -30) scale(.65)"/>
    <rect x="3" y="-46" width="5" height="16" rx="2.5" fill="#4f46e5"/>
  </g></g></g>
</svg>
